# Gateway nginx PARTAGÉE (docker-compose.gateway.yml). Seul service qui écoute sur 80/443.
# Tourne en `network_mode: host` : elle termine le TLS puis proxifie vers le nginx interne de
# chaque stack, publié sur la loopback de l'hôte :
#
#   api.sentaa.net -> 127.0.0.1:8001  (stack prod)
#   dev.sentaa.net -> 127.0.0.1:8002  (stack staging)
#
# Un unique certificat SAN (api.sentaa.net + dev.sentaa.net) est émis par scripts/setup-ssl.sh
# dans /etc/letsencrypt (monté en lecture seule).
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30;
    keepalive_requests 100;
    server_tokens      off;

    client_max_body_size       20m;
    client_body_buffer_size    16k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Rate limiting (par IP) ────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m    rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m     rate=120r/m;
    limit_req_zone  $binary_remote_addr zone=webhook_zone:5m  rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # Nginx interne de chaque stack (publié sur la loopback de l'hôte).
    upstream django_prod {
        server 127.0.0.1:8001;
        keepalive 16;
    }
    upstream django_dev {
        server 127.0.0.1:8002;
        keepalive 8;
    }

    # Map pour l'upgrade WebSocket (Connection: upgrade si Upgrade présent, sinon close).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── HTTP : challenge ACME + redirection HTTPS ─────────────────────────────
    server {
        listen 80;
        server_name api.sentaa.net dev.sentaa.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── PROD : api.sentaa.net ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.sentaa.net;

        ssl_certificate     /etc/letsencrypt/live/api.sentaa.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.sentaa.net/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # WebSockets Channels (chat + suivi coursier).
        location /ws/ {
            proxy_pass http://django_prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        # Webhook Mobile Money (NotchPay) — encaissement escrow, ne pas throttler agressivement.
        location = /api/mobile-money-webhook/ {
            limit_req  zone=webhook_zone burst=20 nodelay;
            limit_conn conn_zone 10;
            proxy_pass http://django_prod;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # Endpoints d'authentification / OTP — limite stricte (anti brute-force).
        location ~ ^/api/(register|otp-request|otp-verify|token/refresh|logout)/ {
            limit_req  zone=auth_zone burst=5 nodelay;
            limit_conn conn_zone 10;
            proxy_pass http://django_prod;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location / {
            limit_req  zone=api_zone burst=50 nodelay;
            limit_conn conn_zone 20;
            proxy_pass http://django_prod;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
        }
    }

    # ── STAGING : dev.sentaa.net ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name dev.sentaa.net;

        ssl_certificate     /etc/letsencrypt/live/api.sentaa.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.sentaa.net/privkey.pem;

        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;

        location /ws/ {
            proxy_pass http://django_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req  zone=api_zone burst=100 nodelay;
            limit_conn conn_zone 30;
            proxy_pass http://django_dev;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
        }
    }
}
