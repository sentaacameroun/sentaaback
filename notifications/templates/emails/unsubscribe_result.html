<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senta'a</title>
<style>
  body { margin:0; padding:40px 16px; background:#F4F6F5; font-family:Arial,Helvetica,sans-serif; color:#22282B; }
  .card { max-width:420px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card img { width:64px; height:auto; margin-bottom:16px; }
  h1 { font-size:18px; margin:0 0 8px; color:#22282B; }
  p { font-size:14px; line-height:1.5; color:#5B6670; margin:0; }
</style>
</head>
<body>
  <div class="card">
    <img src="{{ logo_url }}" alt="Senta'a">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
  </div>
</body>
</html>
