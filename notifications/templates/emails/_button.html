{% comment %}
Bouton CTA réutilisable (table + lien, pas de <button> — non fiable dans les clients mail).
Usage : {% include "emails/_button.html" with button_url=some_url button_label="Voir" %}
Se dégrade proprement sous Outlook desktop (le rectangle reste, le radius est juste ignoré).
{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
  <tr>
    <td align="center" bgcolor="#2E7DA6" style="border-radius:6px;">
      <a href="{{ button_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:6px;">{{ button_label }}</a>
    </td>
  </tr>
</table>
