# Config "bootstrap" HTTP-only : active dès `docker compose up`, avant qu'un nom de domaine /
# certificat TLS n'existe. Sert aussi le challenge ACME de certbot pour l'émission du premier
# certificat. Une fois DOMAIN_NAME configuré et le certificat obtenu (voir deploy/README.md),
# remplacer ce fichier par une copie de sentaa-ssl.conf.example (domaine renseigné) et recharger
# nginx (`docker compose exec nginx nginx -s reload`).

upstream sentaa_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # WebSockets (chat + suivi coursier temps réel) : upgrade de connexion + timeout long,
    # sans quoi Channels ne fonctionne pas derrière un reverse-proxy.
    location /ws/ {
        proxy_pass http://sentaa_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://sentaa_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
