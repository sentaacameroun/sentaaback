#   docker compose up -d
#   docker compose logs -f web
#
x-app-image: &app-image
  build: .
  image: sentaaback:dev
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-sentaa}
    POSTGRES_USER: ${POSTGRES_USER:-sentaa}
    POSTGRES_PASS: ${POSTGRES_PASSWORD:-sentaa}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    DEBUG: "True"
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentaa}
      POSTGRES_USER: ${POSTGRES_USER:-sentaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentaa}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentaa} -d ${POSTGRES_DB:-sentaa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app-image
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"

  celery_worker:
    <<: *app-image
    command: celery -A back_sentaa worker -l info --concurrency=2
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A back_sentaa inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_beat:
    <<: *app-image
    command: celery -A back_sentaa beat -l info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true

  flower:
    <<: *app-image
    command: celery -A back_sentaa flower --port=5555
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5555:5555" 
volumes:
  postgres_data:
