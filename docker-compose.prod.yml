# Production (VPS) : nginx + certbot devant, gunicorn/uvicorn ASGI, Celery worker/beat/flower.
# Pour le développement local : docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f web

x-app-image: &app-image
  build: .
  image: sentaaback:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-sentaa}
    POSTGRES_USER: ${POSTGRES_USER:-sentaa}
    POSTGRES_PASS: ${POSTGRES_PASSWORD}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentaa}
      POSTGRES_USER: ${POSTGRES_USER:-sentaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentaa} -d ${POSTGRES_DB:-sentaa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    <<: *app-image
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  celery_worker:
    <<: *app-image
    command: celery -A back_sentaa worker -l info --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=200
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A back_sentaa inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - media_volume:/app/media

  celery_beat:
    <<: *app-image
    command: celery -A back_sentaa beat -l info --schedule=/tmp/celerybeat-schedule
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true

  flower:
    <<: *app-image
    command: celery -A back_sentaa flower --port=5555
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # Accès depuis ton poste via : ssh -L 5555:localhost:${FLOWER_PORT:-5555} <user>@<vps>
      # FLOWER_PORT ajustable dans .env si le port 5555 est déjà pris sur l'hôte.
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"

  nginx:
    image: nginx:alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/sentaa.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

    entrypoint: "true"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_webroot:
