databases:
  - name: sentaa-postgres
    plan: free
    databaseName: sentaa
    user: sentaa

services:
  - type: redis
    name: sentaa-redis
    plan: free
    ipAllowList: []

  - type: web
    name: sentaa-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/categories/
    preDeployCommand: python manage.py migrate
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: sentaa-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: sentaa-postgres
          property: user
      - key: POSTGRES_PASS
        fromDatabase:
          name: sentaa-postgres
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: sentaa-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: sentaa-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentaa-redis
          property: connectionString
      - key: NOTCHPAY_BASE_URL
        value: https://api.notchpay.co
      - key: NOTCHPAY_PUBLIC_KEY
        sync: false
      - key: NOTCHPAY_PRIVATE_KEY
        sync: false
      - key: SMS_BACKEND
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
